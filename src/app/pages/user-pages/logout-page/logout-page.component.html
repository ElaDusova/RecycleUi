<main>
  <section class="min-h-screen flex items-center justify-center bg-gray-100">
    <!-- Container Box with Shadow and Padding -->
    <div class="bg-white shadow-lg rounded-lg p-8 w-full sm:max-w-sm">
      <!-- Title: Centered "LOG OUT" -->
      <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">Log Out</h2>

      <!-- Error Message -->
      <div
        [class.hidden]="!errorMessage"
        class="mb-5 p-4 text-sm text-red-600 bg-red-100 border border-red-400 rounded-lg"
      >
        {{ errorMessage }}
      </div>

      <!-- Confirmation Message -->
      <p class="text-center text-sm text-gray-600 mb-6">
        Are you sure you want to log out?
      </p>

      <!-- Logout Button -->
      <div class="space-y-4">
        <button
          (click)="onLogout()"
          [disabled]="isLoading"
          class="flex w-full justify-center rounded-md bg-red-600 px-3 py-1.5 text-sm font-semibold text-white shadow-sm hover:bg-red-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500"
        >
          {{ isLoading ? 'Logging out...' : 'Log Out' }}
        </button>

        <!-- Cancel Button -->
        <button
        (click)="goBack()"
        class="block text-center w-full justify-center rounded-md bg-gray-200 px-3 py-1.5 text-sm font-semibold text-gray-900 hover:bg-gray-300 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-500"
      >
        Cancel
      </button>
            </div>
    </div>
  </section>
</main>
