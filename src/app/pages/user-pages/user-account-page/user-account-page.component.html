<div class="bg-gray-50 min-h-screen flex items-center justify-center py-10">
  <div class="bg-white shadow-md rounded-lg p-8 max-w-5xl w-full">
    <!-- User Profile Section -->
    <div class="flex flex-col items-center space-y-4">
      <!-- User Profile Picture -->
      <div class="relative w-24 h-24">
        @if (user?.profilePicture) {
          <img [src]="user?.profilePicture" alt="Profile Picture" class="rounded-full w-full h-full object-cover" />
        } @else {
          <div class="bg-gray-200 rounded-full w-full h-full flex items-center justify-center text-gray-500">
            <i class="fas fa-user text-2xl"></i>
          </div>
        }
      </div>

      <p class="text-lg font-semibold">{{ user?.displayname || 'Username' }}</p>
      <button
        class="flex items-center space-x-2 text-sm text-mainGreen hover:text-hoverGreen"
        (click)="openModal('profilePicture')"
      >
        Change Profile Picture
      </button>
    </div>

    <!-- Account Options -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-10">
      <div class="space-y-4">
        <button class="w-full bg-gray-200 hover:bg-gray-300 text-gray-900 rounded-lg px-4 py-2"
          (click)="openModal('displayname')">
          Change Username
        </button>
        <button class="w-full bg-gray-200 hover:bg-gray-300 text-gray-900 rounded-lg px-4 py-2"
          (click)="openModal('password')">
          Change Password
        </button>
      </div>

      <!-- User Info Table -->
      <div class="overflow-hidden shadow rounded-lg border border-gray-200">
        <table class="min-w-full divide-y divide-gray-200">
          <tbody class="divide-y divide-gray-200">
            @for (field of userInfoFields; track field.key) {
              <tr>
                <td class="px-4 py-2 font-medium text-gray-900">{{ field.label }}</td>
                <td class="px-4 py-2 text-gray-600">{{ user?.[field.key] || '-' }}</td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- MODAL (Dynamic) -->
@if (activeModal) {
  <div class="fixed inset-0 bg-gray-800 bg-opacity-75 flex justify-center items-center">
    <div class="bg-white rounded-lg p-6 w-96 shadow-lg">
      <h3 class="text-lg font-semibold text-gray-700 mb-4">{{ modalTitle }}</h3>

      <label class="block text-sm text-gray-600">{{ modalLabel }}</label>
      <input type="text" [(ngModel)]="modalValue" class="w-full p-2 border rounded mb-3" />

      <div class="flex justify-between mt-4">
        <button class="bg-gray-500 text-white px-4 py-2 rounded" (click)="closeModal()">Cancel</button>
        <button class="bg-blue-500 text-white px-4 py-2 rounded" (click)="saveChanges()">Save</button>
      </div>
    </div>
  </div>
}
