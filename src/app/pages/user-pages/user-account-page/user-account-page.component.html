<div class="container mx-auto p-6 max-w-lg bg-white shadow-lg rounded-lg">
  <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">User Account</h2>

  @if (user) {
    <div class="space-y-4 text-center">
      <p><strong>ID:</strong> {{ user.id }}</p>
      <p><strong>Username:</strong> {{ user.name }}</p>
      <p><strong>Authenticated:</strong> {{ user.isAuthenticated ? 'Yes' : 'No' }}</p>
      <p><strong>Admin:</strong> {{ user.isAdmin ? 'Yes' : 'No' }}</p>
    </div>
  } @else {
    <p class="text-gray-500 text-center">Loading user data...</p>
  }

  @if (errorMessage) {
    <p class="text-red-500 text-center mt-4">{{ errorMessage }}</p>
  }
</div>
