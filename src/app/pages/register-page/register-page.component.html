<section class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white shadow-lg rounded-lg p-8 w-full sm:max-w-sm">
    <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">Registration</h2>

    <!-- Success Message -->
    @if (successMessage) {
      <div class="mb-4 text-green-600 font-medium text-center">{{ successMessage }}</div>
    }

    <!-- Error Message -->
    @if (errorMessage) {
      <div class="mb-4 text-red-600 font-medium text-center">{{ errorMessage }}</div>
    }

    <form class="space-y-6" [formGroup]="formular" (ngSubmit)="onSubmit()">
      <div class="mb-5">
        <label for="firstname" class="block mb-2 text-sm font-medium">First Name</label>
        <input type="text" id="firstname" formControlName="firstname"
          class="w-full border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5" required />
      </div>

      <div class="mb-5">
        <label for="lastname" class="block mb-2 text-sm font-medium">Last Name</label>
        <input type="text" id="lastname" formControlName="lastname"
          class="w-full border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5" required />
      </div>

      <div class="mb-5">
        <label for="username" class="block mb-2 text-sm font-medium">Username</label>
        <input type="text" id="username" formControlName="username"
          class="w-full border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5" required />
      </div>

      <div class="mb-5">
        <label for="dateofbirth" class="block mb-2 text-sm font-medium">Date of Birth</label>
        <input type="date" id="dateofbirth" formControlName="dateofbirth"
          class="w-full border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5" required />
      </div>

      <div class="mb-5">
        <label for="email" class="block mb-2 text-sm font-medium">Your email</label>
        <input type="email" id="email" formControlName="email"
          class="w-full border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5" required />
      </div>

      <div class="mb-5">
        <label for="password" class="block mb-2 text-sm font-medium">Your password</label>
        <input type="password" id="password" formControlName="password"
          class="w-full border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5" required />
      </div>

      <div class="mb-5">
        <label for="passwordConfirm" class="block mb-2 text-sm font-medium">Confirm password</label>
        <input type="password" id="passwordConfirm" formControlName="passwordConfirm"
          class="w-full border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5" required />
      </div>

      <button type="submit"
        class="w-full px-5 py-2.5 text-white bg-mainGreen hover:bg-hoverGreen rounded-lg"
        [disabled]="isSubmitting">
        @if (isSubmitting) {
          <span>Registering...</span>
        } @else {
          <span>Register</span>
        }
      </button>
    </form>
  </div>
</section>
