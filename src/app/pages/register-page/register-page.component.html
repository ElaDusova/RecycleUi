<section class="min-h-screen flex items-center justify-center bg-gray-100">
  <!-- Container Box with Shadow and Padding -->
  <div class="bg-white shadow-lg rounded-lg p-8 w-full sm:max-w-sm">
    <!-- Title: Centered "Registration" -->
    <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">Registration</h2>

    <!-- Registration Form -->
    <form class="space-y-6" [formGroup]="formular" (ngSubmit)="onSubmit()">
      <div class="mb-5">
        <label for="email" class="block mb-2 text-sm font-medium">Your email</label>
        <input type="email" id="email" formControlName="email" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:border-gray-600 dark:placeholder-gray-400 dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="name@mail.com" required />
      </div>

      <div class="mb-5">
        <label for="name" class="block mb-2 text-sm font-medium">Your name</label>
        <input type="text" id="name" formControlName="name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:border-gray-600 dark:placeholder-gray-400 dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="username" required />
      </div>

      <div class="mb-5">
        <label for="password" class="block mb-2 text-sm font-medium">Your password</label>
        <input type="password" id="password" formControlName="password" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:border-gray-600 dark:placeholder-gray-400 dark:focus:ring-blue-500 dark:focus:border-blue-500" placeholder="password" required />
      </div>

      <button type="submit" class="text-white bg-mainGreen hover:bg-hoverGreen focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center dark:bg-green-400 dark:hover:bg-blue-700 dark:focus:ring-blue-800">Register</button>
    </form>
  </div>
</section>
