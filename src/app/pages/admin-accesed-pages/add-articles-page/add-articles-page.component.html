<section class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-4xl">
    <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">
      Write us some awesome news in the recycling world! (Article)
    </h2>

    @if (errorMessage) {
      <div class="mb-5 p-4 text-sm text-red-600 bg-red-100 border border-red-400 rounded-lg">
        {{ errorMessage }}
      </div>
    }

    <form class="space-y-6" (submit)="onSubmit()">
      <!-- Heading -->
      <div>
        <label class="block mb-2 text-sm font-medium text-gray-700">Article Heading</label>
        <input type="text" [(ngModel)]="article.heading" name="heading"
          class="w-full border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5" required />
      </div>

      <!-- Annotation -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-700">Annotation (Short Summary)</label>
          <input type="text" [(ngModel)]="article.annotation" name="annotation"
            class="w-full border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5" required />
        </div>
      </div>

      <!-- Article Text -->
      <div class="mb-6">
        <label class="block mb-2 text-sm font-medium text-gray-700">Article Text</label>
        <quill-editor
          [(ngModel)]="article.text"
          name="text"
          [style]="{height: '250px'}"
          [modules]="quillModules"
          class="w-full h-40 border-gray-300 text-gray-900 text-sm rounded-lg p-2.5"
        ></quill-editor>
      </div>

      <!-- Image Upload Section -->
      <div class="mb-4">
        <label class="block mb-2 text-sm font-medium text-gray-700">Upload Article Image</label>

        <!-- Image Preview -->
        @if (imagePreview) {
          <div class="mb-2 flex flex-col items-center">
            <img [src]="imagePreview" alt="Image Preview" class="h-32 w-32 object-cover rounded-lg mb-2">
            <button type="button" class="px-3 py-1 bg-red-500 text-white text-sm rounded-lg hover:bg-red-600"
              (click)="removeImage()">Remove Image</button>
          </div>
        }

        <div class="flex flex-col items-center justify-center border border-gray-300 bg-white rounded-lg p-4 my-2">
          <input #fileInput type="file" (change)="onFileSelected($event)" class="hidden">
          <button type="button"
            class="w-1/3 px-12 py-2 text-white rounded-lg bg-mainGreen hover:bg-hoverGreen"
            (click)="triggerFileInput()">Select Image</button>
        </div>
      </div>

      <!-- Date of Creation -->
      <div>
        <label class="block mb-2 text-sm font-medium text-gray-700">Date of Creation</label>
        <div class="w-full border border-gray-300 text-gray-400 rounded-lg p-2.5 my-2">{{ currentDate }}</div>
      </div>

      <!-- Submit Button -->
      <button type="submit"
        class="w-full text-white bg-mainGreen hover:bg-hoverGreen font-medium rounded-lg text-sm px-5 py-2.5">
        Add Article
      </button>
      <button (click)="goBack()"
        class="w-full px-4 py-2 bg-gray-300 text-white rounded-lg mt-2 hover:bg-gray-400">
        Cancel
      </button>
    </form>
  </div>
</section>
