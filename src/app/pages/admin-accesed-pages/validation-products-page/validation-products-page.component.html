<section class="min-h-screen flex flex-col items-center justify-center bg-gray-100 p-6">
  <!-- Unverified Products List -->
  <div class="bg-white shadow-lg rounded-lg p-6 w-full max-w-5xl">
    <h2 class="text-2xl font-bold text-center text-gray-900 mb-4">Unverified Products</h2>

    @if (products.length > 0) {
      <table class="w-full border-collapse border border-gray-300">
        <thead>
          <tr class="bg-gray-200">
            <th class="border border-gray-300 p-2">Name</th>
            <th class="border border-gray-300 p-2">EAN</th>
            <th class="border border-gray-300 p-2">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (product of products; track product.id) {
            <tr class="border border-gray-300">
              <td class="p-2 border border-gray-300">{{ product.name }}</td>
              <td class="p-2 border border-gray-300">{{ product.ean }}</td>
              <td class="p-2 flex justify-center items-center gap-6">
                <button class="px-8 py-1 bg-mainGreen text-white rounded-md hover:bg-hoverGreen"
                  (click)="verifyProduct(product)">
                  Verify
                </button>
                <button class="px-8 py-1 bg-red-500 text-white rounded-md hover:bg-red-600"
                  (click)="deleteProduct(product.id)">
                  Delete
                </button>
              </td>

            </tr>
          }
        </tbody>
      </table>
    } @else {
      <p class="text-center text-gray-500 mt-4">No unverified products found.</p>
    }
  </div>

  <!-- Verification Form -->
  @if (selectedProduct) {
    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-4xl mt-6">
      <h2 class="text-2xl font-bold text-center text-gray-900 mb-6"> Update &  Verify Product</h2>

      <form class="space-y-6">
        <!-- Name & EAN -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Product Name</label>
            <input type="text" [(ngModel)]="selectedProduct.name" name="productName"
              class="w-full border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5" required />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">EAN Code</label>
            <input type="text" [(ngModel)]="selectedProduct.ean" name="productEan"
              class="w-full border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5" required />
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="block text-sm font-medium text-gray-700">Description</label>
          <textarea [(ngModel)]="selectedProduct.description" name="productDescription"
            class="w-full h-40 border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5" required></textarea>
        </div>

        <!-- Save & Cancel Buttons -->
        <div class="flex justify-between">
          <button type="button" class="px-12 py-2 text-white rounded-lg bg-mainGreen hover:bg-hoverGreen"
            (click)="saveChanges()">Update Product</button>
          <button type="button" class="px-12 py-2 text-white rounded-lg bg-gray-500 hover:bg-gray-600"
            (click)="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  }
</section>
