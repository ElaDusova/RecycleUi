<div class="container mx-auto p-4">
  <!-- Header -->
  <h3 class="text-3xl font-semibold text-gray-900 text-center">VALIDATED PRODUCTS</h3>

  <!-- Product List -->
  <div *ngIf="errorMessage" class="text-center text-red-500">{{ errorMessage }}</div>

  <ng-container *ngIf="products$ | async as products">
    <div *ngIf="products.length > 0">
      <div
        *ngFor="let product of products"
        class="relative bg-gray-300 rounded-lg p-4 mb-3 flex justify-between items-center shadow cursor-pointer"
        (click)="openEditModal(product)"
      >
        <div class="flex items-center space-x-4">
          <img [src]="product.picturePath" alt="{{ product.name }}" class="w-12 h-12 object-cover rounded">
          <div>
            <p class="text-gray-700 font-semibold">{{ product.name }}</p>
            <p class="text-gray-500 text-sm">EAN: {{ product.ean }}</p>
          </div>
        </div>

        <!-- Delete Button -->
        <button
        (click)="deleteProduct(product.id); $event.stopPropagation()"
        class="absolute top-2 right-10 bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-3 rounded-lg shadow-md flex items-center transition duration-300"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

        <!-- Validation Badge -->
        <button
        class="absolute top-2 right-2 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-3 rounded-lg shadow-md flex items-center transition duration-300"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </button>

      </div>
    </div>

    <div *ngIf="!loading && products.length === 0" class="text-center text-gray-500">
      No products need validation.
    </div>
  </ng-container>

  <!-- Edit Modal -->
  <div *ngIf="selectedProduct" class="fixed inset-0 bg-gray-800 bg-opacity-75 flex justify-center items-center">
    <div class="bg-white rounded-lg p-6 w-96 shadow-lg">
      <h3 class="text-lg font-semibold text-gray-700 mb-4">Edit Product</h3>

      <label class="block text-sm text-gray-600">Product Name</label>
      <input
        type="text"
        [(ngModel)]="selectedProduct.name"
        class="w-full p-2 border rounded mb-3"
      />

      <label class="block text-sm text-gray-600">EAN</label>
      <input
        type="text"
        [(ngModel)]="selectedProduct.ean"
        class="w-full p-2 border rounded mb-3"
      />

      <label class="block text-sm text-gray-600">Description</label>
      <textarea
        [(ngModel)]="selectedProduct.description"
        class="w-full p-2 border rounded mb-3"
      ></textarea>

      <div class="flex justify-between mt-4">
        <button
          class="bg-gray-500 text-white px-4 py-2 rounded"
          (click)="closeModal()"
        >
          Cancel
        </button>
        <button
          class="bg-blue-500 text-white px-4 py-2 rounded"
          (click)="saveChanges()"
        >
          Save
        </button>
      </div>
    </div>
  </div>
</div>
