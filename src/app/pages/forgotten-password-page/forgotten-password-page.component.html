<main>
  <section class="min-h-screen flex items-center justify-center bg-gray-100">
    <!-- Container Box -->
    <div class="bg-white shadow-lg rounded-lg p-8 w-full sm:max-w-sm">
      <!-- Title -->
      <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">Forgot Password</h2>

      <!-- Form -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6" novalidate>
        <!-- Error Message -->
        <div
          *ngIf="errorMessage"
          class="mb-5 p-4 text-sm text-red-600 bg-red-100 border border-red-400 rounded-lg"
        >
          {{ errorMessage }}
        </div>

        <!-- Success Message -->
        <div
          *ngIf="successMessage"
          class="mb-5 p-4 text-sm text-green-600 bg-green-100 border border-green-400 rounded-lg"
        >
          {{ successMessage }}
        </div>

        <!-- Email Input -->
        <div>
          <label for="email" class="block text-sm font-medium text-gray-900">Your email</label>
          <div class="mt-2">
            <input
              type="email"
              id="email"
              formControlName="email"
              class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
              placeholder="name@mail.com"
            />
            <small
              *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')"
              class="text-red-600"
            >
              Email is required.
            </small>
            <small
              *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')"
              class="text-red-600"
            >
              Please enter a valid email address.
            </small>
          </div>
        </div>

        <!-- Submit Button -->
        <div>
          <button
            type="submit"
            [disabled]="isLoading"
            class="flex w-full justify-center rounded-md bg-mainGreen px-3 py-1.5 text-sm font-semibold text-white shadow-sm hover:bg-hoverGreen focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
          >
            {{ isLoading ? 'Sending...' : 'Send Reset Email' }}
          </button>
        </div>
      </form>

      <!-- Back to Login -->
      <p class="text-center text-sm text-gray-600 mt-4">
        <a
          routerLink="/login"
          class="font-semibold text-mainGreen hover:text-hoverGreen"
        >
          Back to Login
        </a>
      </p>
    </div>
  </section>
</main>
