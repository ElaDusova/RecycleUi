<div class="bg-gray-50 min-h-screen py-10 px-6">
  <!-- Search Bar -->
  <div class="max-w-xl mx-auto mb-8">
    <input
      type="text"
      placeholder="Search by Name or EAN..."
      [(ngModel)]="searchQuery"
      (input)="onSearchChange()"
      class="block w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"
    />
    <button>
      <a routerLink="/product/add" class="block w-full bg-mainGreen text-white font-bold py-4 px-6 rounded-lg hover:bg-hoverGreen transition">
        Add Product
      </a>
    </button>
  </div>

  <!-- Products Grid -->
  <div
    *ngIf="filteredProducts.length > 0"
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 max-w-7xl mx-auto"
  >
    <!-- Product Card -->
    <div
      *ngFor="let product of filteredProducts"
      (click)="viewProductDetail(product.id)"
      class="bg-white border border-gray-300 rounded-lg shadow-sm hover:shadow-lg transition-shadow"
    >
      <!-- Product Image -->
      <img
        *ngIf="product.picturePath"
        [src]="product.picturePath"
        alt="{{ product.name }}"
        class="w-full h-48 object-cover rounded-t-lg"
      />
      <div *ngIf="!product.picturePath" class="w-full h-48 bg-gray-200 flex items-center justify-center rounded-t-lg">
        <span class="text-gray-500">No Image</span>
      </div>

      <!-- Product Info -->
      <div class="p-4">
        <h3 class="text-lg font-semibold text-gray-800 truncate">{{ product.name }}</h3>
        <p class="text-sm text-gray-600">EAN: {{ product.ean }}</p>
      </div>

      <!-- View Details Button -->
      <div class="p-4">
        <button
          (click)="viewProductDetail(product.id)"
          class="block w-full bg-mainGreen text-white font-bold py-2 rounded-lg hover:bg-hoverGreen transition"
        >
          View Details
        </button>
      </div>
    </div>
  </div>

  <!-- No Products Found -->
  <div *ngIf="filteredProducts.length === 0" class="text-center mt-16">
    <p class="text-gray-500 text-lg">No products found matching your search.</p>
    <p class="text-gray-500 text-lg">Want to add this product of yours?</p>

  </div>
