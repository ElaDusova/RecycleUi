<div class="min-h-screen bg-gray-100 flex items-center justify-center px-6">
  <div class="text-center max-w-lg">
    <!-- Error Code -->
    <h1 class="text-9xl font-extrabold text-mainGreen">404</h1>
    <!-- Error Message -->
    <p class="mt-4 text-3xl font-bold text-gray-800">Page Not Found</p>
    <p class="mt-2 text-lg text-gray-600">
      Sorry, we couldn’t find the page you’re looking for.
    </p>
    <!-- Go back button -->
    <div class="mt-6 flex justify-center space-x-4">
      <button
        (click)="goBack()"
        class="inline-flex items-center px-5 py-3 text-sm font-medium text-white bg-mainGreen rounded-lg shadow hover:bg-hoverGreen focus:outline-none focus:ring-2 focus:ring-mainGreen focus:ring-offset-2">
        Go Back
      </button>
    </div>
  </div>
</div>
