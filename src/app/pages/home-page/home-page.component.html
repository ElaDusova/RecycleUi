<div class="bg-white py-24 sm:py-12">
  <div class="mx-auto max-w-5xl px-6 lg:px-8">
    <!-- Blog Section Title -->
    <div class="mx-auto max-w-2xl lg:mx-0">
      <h2 class="text-pretty text-4xl font-semibold tracking-tight text-gray-900 sm:text-5xl">Articles</h2>
      <p class="mt-2 text-lg/8 text-gray-600">What's new in the recycling world.</p>
    </div>

    <!-- Articles Grid -->
    <div class="mx-auto mt-10 grid max-w-2xl grid-cols-1 gap-x-8 gap-y-16 border-t border-gray-200 pt-10 sm:mt-16 sm:pt-16 lg:mx-0 lg:max-w-none lg:grid-cols-3">
      <!-- Loop Through Articles -->
      <a *ngFor="let article of articles"
        [routerLink]="['/article/detail', article.id]"
        class="flex max-w-xl flex-col items-start justify-between border border-gray-300 p-6 rounded-lg hover:shadow-lg transition-all">
        <div class="group relative">
          <h3 class="mt-3 text-lg/6 font-semibold text-gray-900 group-hover:text-gray-600">
            <span class="absolute inset-0"></span>
            {{ article.heading }}
          </h3>
          <p class="mt-5 line-clamp-3 text-sm/6 text-gray-600">
            {{ article.annotation }}
          </p>
        </div>
        <div class="relative mt-8 flex items-center gap-x-4">
          <img *ngIf="article.picturePath" [src]="article.picturePath" alt="Article Image" class="w-16 h-16 rounded-full" />
          <div class="text-sm/6">
            <p class="font-semibold text-gray-900">
              <span class="absolute inset-0"></span>
              Author Name
            </p>
            <p class="text-gray-600">{{ article.authorsName }}</p>
          </div>
        </div>
      </a>
    </div>

    <!-- No Articles Message -->
    <section class="no-articles mt-4 text-center" *ngIf="!articles || articles.length === 0">
      <p class="text-gray-500">No articles available at the moment.</p>
    </section>
  </div>
</div>
