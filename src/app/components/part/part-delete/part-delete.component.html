<section class="min-h-screen flex items-center justify-center bg-gray-100 p-6">
  <div class="bg-white shadow-lg rounded-lg p-6 w-full max-w-5xl">
    <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">Delete Parts</h2>

    @if (parts && parts.length > 0) {
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (part of parts; track part.id) {
          <div class="border rounded-lg shadow p-4 flex flex-col bg-gray-50">
            <h3 class="text-lg font-semibold text-center mb-2">{{ part.name }}</h3>
            <p class="text-sm text-gray-700 mb-4 text-center">Verified: {{ part.isVerified ? 'Yes' : 'No' }}</p>
            <button (click)="deletePart(part.id)"
                    class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 transition self-center">
              Delete
            </button>
          </div>
        }
      </div>
    } @else {
      <p class="text-center text-gray-500 mt-4">No parts available to delete.</p>
    }
  </div>
</section>
