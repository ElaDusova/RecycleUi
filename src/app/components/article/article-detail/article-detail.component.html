<div class="bg-white py-24 sm:py-12">
  <div class="mx-auto max-w-5xl px-6 lg:px-8">
    <!-- Article Title and Content -->
    <div class="mx-auto max-w-2xl lg:mx-0">
      <h2 class="text-pretty text-4xl font-semibold tracking-tight text-gray-900 sm:text-5xl">
        {{ article.heading }}
      </h2>
    </div>

    <!-- Article Image and Author Info -->
    <div class="mt-8">
      <div class="flex items-center gap-x-4">
        <img *ngIf="article?.picturePath" [src]="article.picturePath" alt="Article Image" class="w-16 h-16 rounded-full" />
        <div class="text-sm/6">
          <p class="font-semibold text-gray-900">Author Name</p>
          <p class="text-gray-600">{{ article.authorsName }}</p>
        </div>
      </div>
    </div>

    <!-- Article Content -->
    <div class="mt-10 text-lg text-gray-700">
      <p>{{ article.text }}</p>
    </div>

    <!-- No Article Message -->
    <section *ngIf="!article" class="mt-4 text-center">
      <p class="text-gray-500">Article not found.</p>
    </section>
  </div>
</div>
