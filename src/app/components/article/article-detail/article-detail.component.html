<div class="article-detail bg-white py-24 sm:py-12">
  <div class="mx-auto max-w-5xl px-6 lg:px-8">
    <div class="flex flex-col lg:flex-row gap-8 py-10">

      <!-- Left: Text content -->
      <div class="w-full lg:w-3/4 lg:pr-8">
        <h2 class="text-4xl font-semibold text-gray-900 sm:text-5xl whitespace-normal break-words" style="line-height: 1.2">
          @if (article) {
            {{ article.heading }}
          } @else {
            <span>Article Not Found</span>
          }
        </h2>

        <p class="mt-8 text-2xl font-semibold text-gray-900 mb-4">
          Author: {{ article.authorsName }}
        </p>

        <div class="prose max-w-4xl break-words whitespace-normal overflow-hidden" [innerHTML]="article.text"></div>
      </div>

      <!-- Right: Image -->
      <div class="w-full lg:w-1/4 flex justify-center lg:justify-end">
        <div class="w-64 h-64 overflow-hidden rounded-lg shadow-lg bg-gray-200">
          @if (article.picturePath) {
            <img [src]="article.picturePath" alt="{{ article.heading }}" class="w-full h-full object-cover" />
          } @else {
            <div class="flex items-center justify-center h-full text-gray-500">
              No Image
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
