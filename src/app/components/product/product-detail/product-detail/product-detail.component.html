<div class="product-container">
  <div class="content-wrapper">
    <!-- Product Title and Description -->
    <div class="product-info">
      <h2 class="product-title">
        @if (product) {
          {{ product.name }}
        } @else {
          <span>Product Not Found</span>
        }
      </h2>
      @if (product) {
        <p class="product-description">{{ product.description }}</p>
      }
    </div>

    <!-- Product Image and Info -->
    @if (product) {
      <div class="product-details">
        <div class="product-image-wrapper">
          <!-- Product Image -->
          @if (product.picturePath) {
            <img [src]="product.picturePath" alt="Product Image" class="product-image" />
          } @else {
            <div class="no-image">No Image</div>
          }

          <div class="product-meta">
            <p class="meta-label">EAN</p>
            <p class="meta-value">{{ product.ean }}</p>
            <p class="meta-label">Verified</p>
            <p class="meta-value">{{ product.isVerified ? 'Yes' : 'No' }}</p>
          </div>
        </div>
      </div>
    }
  </div>
</div>
