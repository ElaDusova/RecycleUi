<div class="bg-white py-24 sm:py-12">
  <div class="mx-auto max-w-5xl px-6 lg:px-8">
    <!-- Product Title and Description -->
    <div class="mx-auto max-w-2xl lg:mx-0">
      <h2 class="text-pretty text-4xl font-semibold tracking-tight text-gray-900 sm:text-5xl">
        {{ product.name }}
      </h2>
      <p class="mt-2 text-lg text-gray-600">{{ product.description }}</p>
    </div>

    <!-- Product Image and Info -->
    <div class="mt-8">
      <div class="flex items-center gap-x-4">
        <!-- Product Image -->
        <img
          *ngIf="product?.picturePath"
          [src]="product.picturePath"
          alt="Product Image"
          class="w-32 h-32 rounded-lg"
        />
        <div *ngIf="!product?.picturePath" class="w-32 h-32 bg-gray-200 rounded-lg flex items-center justify-center text-gray-500">
          No Image
        </div>
        <div class="text-sm/6">
          <p class="font-semibold text-gray-900">EAN</p>
          <p class="text-gray-600">{{ product.ean }}</p>
          <p class="mt-2 font-semibold text-gray-900">Verified</p>
          <p class="text-gray-600">
            {{ product.isVerified ? 'Yes' : 'No' }}
          </p>
        </div>
      </div>
    </div>

    <!-- No Product Message -->
    <section *ngIf="!product" class="mt-4 text-center">
      <p class="text-gray-500">Product not found.</p>
    </section>
  </div>
</div>
