<section class="min-h-screen flex items-center justify-center bg-gray-100 py-12">
  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-5xl">
    <h2 class="text-3xl font-bold text-center text-gray-900 mb-8">Delete Products</h2>

    @if (products.length > 0) {
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (product of products; track product.id) {
          <div class="bg-gray-50 p-4 rounded-lg shadow-md">
            <div class="flex flex-col items-center">
              @if (product.picturePath) {
                <img [src]="product.picturePath" alt="{{ product.name }}" class="h-40 w-40 object-cover rounded-lg mb-2" />
              } @else {
                <div class="h-40 w-40 bg-gray-200 flex items-center justify-center text-gray-500 rounded-lg mb-2">
                  No Image
                </div>
              }
              <h3 class="text-lg font-bold text-gray-900">{{ product.name }}</h3>
              <p class="text-sm text-gray-600 mt-1">Verified: {{ product.isVerified ? 'Yes' : 'No' }}</p>
              <button (click)="deleteProduct(product.id)" class="mt-4 px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600">
                Delete
              </button>
            </div>
          </div>
        }
      </div>
    } @else {
      <p class="text-center text-gray-600 mt-4">No products available to delete.</p>
    }
  </div>
</section>
