<div class="flex flex-col items-center space-y-4 w-full max-w-md bg-white p-6 rounded-lg shadow-md">
  <!-- Input field for EAN -->
  <form class="flex flex-col items-center space-y-2 w-full" (ngSubmit)="onSearchSubmit()">
    <input
      class="form-control block w-full p-2.5 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"
      placeholder="Enter EAN of your product"
      [(ngModel)]="eanInput"
      name="eanInput"
      required
    />
    <button
      type="submit"
      class="w-full bg-mainGreen hover:bg-hoverGreen text-white font-bold py-2 px-4 rounded-lg focus:ring-4 focus:ring-blue-300"
    >
      Send
    </button>
  </form>

  <!-- Add Product Button -->
  <button
    class="w-full bg-mainGreen hover:bg-hoverGreen text-white font-bold py-2 px-4 rounded-lg focus:ring-4 focus:ring-purple-300"
    type="button"
    (click)="showForm = true"
  >
    Add Product
  </button>

  <!-- Conditional Add Product Form -->
  <div *ngIf="showForm" class="w-full mt-4">
    <form [formGroup]="formular" (ngSubmit)="onSubmit()" class="flex flex-col space-y-2">
      <input
        class="form-control block w-full p-2.5 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"
        placeholder="Product Name"
        formControlName="name"
        id="name"
      />
      <input
        class="form-control block w-full p-2.5 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"
        placeholder="EAN"
        formControlName="ean"
        id="ean"
      />
      <textarea
        class="form-control block w-full p-2.5 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"
        placeholder="Description"
        formControlName="description"
        id="description"
      ></textarea>
      <input
        class="form-control block w-full p-2.5 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500"
        placeholder="Picture Path"
        formControlName="picturePath"
        id="picturePath"
      />
      <div class="flex space-x-2">
        <button
          type="submit"
          class="w-full bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg focus:ring-4 focus:ring-green-300"
          [disabled]="formular.invalid"
        >
          Submit
        </button>
        <button
          type="button"
          class="w-full bg-gray-400 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg focus:ring-4 focus:ring-gray-300"
          (click)="closeForm()"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
