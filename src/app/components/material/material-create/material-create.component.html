<section class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-4xl">
    <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">Add a New Material</h2>

    <!-- Success Message -->
    @if (successMessage()) {
      <div class="mb-4 text-green-600 font-medium text-center">{{ successMessage() }}</div>
    }

    <!-- Error Message -->
    @if (errorMessage()) {
      <div class="mb-4 text-red-600 font-medium text-center">{{ errorMessage() }}</div>
    }

    <!-- Material Name -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Material Name</label>
      <input type="text" [(ngModel)]="newMaterial.name" name="materialName" [ngModelOptions]="{standalone: true}"
        class="w-full p-2 border border-gray-300 rounded-lg mb-4 focus:ring focus:ring-mainGreen" required />
    </div>

    <!-- Material Description -->
    <div>
      <label class="block text-sm font-medium text-gray-700">Description</label>
      <textarea [(ngModel)]="newMaterial.description" name="materialDescription" [ngModelOptions]="{standalone: true}"
        class="w-full p-2 border border-gray-300 rounded-lg mb-4 focus:ring focus:ring-mainGreen"></textarea>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Container</label>
      <textarea [(ngModel)]="newMaterial.trashCanMaterials" name="trashCanMaterials" [ngModelOptions]="{standalone: true}"
        class="w-full p-2 border border-gray-300 rounded-lg mb-4 focus:ring focus:ring-mainGreen"></textarea>
    </div>


    <!-- Submit Button -->
    <button type="button"
      class="w-full px-5 py-2 text-white bg-mainGreen hover:bg-hoverGreen rounded-lg transition-transform duration-200 active:scale-95"
      [disabled]="isSubmitting()" (click)="addMaterial()">
      @if (isSubmitting()) {
        <span>Creating...</span>
      } @else {
        <span>Create Material</span>
      }
    </button>
  </div>
</section>
