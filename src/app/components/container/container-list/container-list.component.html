<div class="bg-white py-24 sm:py-12">
  <div class="mx-auto max-w-5xl px-6 lg:px-8">
    <!-- Container Title and Description -->
    <div class="mx-auto max-w-2xl lg:mx-0">
      <h2 class="text-pretty text-4xl font-semibold tracking-tight text-gray-900 sm:text-5xl">
        {{ container.name }}
      </h2>
    </div>

    <!-- Container Image and Can Type -->
    <div class="mt-8">
      <div class="flex items-center gap-x-4">
        <img
          *ngIf="container?.picturePath"
          [src]="container.picturePath"
          alt="{{ container.name }}"
          class="w-32 h-32 rounded-lg"
        />
        <div *ngIf="!container?.picturePath" class="w-32 h-32 bg-gray-200 rounded-lg flex items-center justify-center text-gray-500">
          No Image
        </div>
      </div>
    </div>

    <!-- No Container Message -->
    <section *ngIf="!container" class="mt-4 text-center">
      <p class="text-gray-500">Container not found.</p>
    </section>
  </div>
</div>
