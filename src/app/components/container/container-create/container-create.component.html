<section class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-4xl">
    <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">Add a New Container</h2>

    <form class="space-y-6" (submit)="onSubmit()">
      <!-- Container Name -->
      <div>
        <label class="block mb-2 text-sm font-medium text-gray-700">Container Name</label>
        <input type="text" [(ngModel)]="newContainer.name" name="containerName" [ngModelOptions]="{standalone: true}"
          class="w-full border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5" required />
      </div>

      <!-- Description -->
      <div>
        <label class="block mb-2 text-sm font-medium text-gray-700">Description</label>
        <textarea [(ngModel)]="newContainer.description" name="containerDescription" [ngModelOptions]="{standalone: true}"
          class="w-full h-40 border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5" required></textarea>
      </div>

      <!-- Image Upload Section -->
      <div class="mb-4">
        <label class="block mb-2 text-sm font-medium text-gray-700">Upload Container Image</label>

        <!-- Image Preview -->
        @if (imagePreview) {
          <div class="mb-2 flex flex-col items-center">
            <img [src]="imagePreview" alt="Image Preview" class="h-32 w-32 object-cover rounded-lg mb-2">
            <button type="button" class="px-3 py-1 bg-red-500 text-white text-sm rounded-lg hover:bg-red-600"
              (click)="removeImage()">Remove Image</button>
          </div>
        }

        <div class="flex flex-col items-center justify-center border border-gray-300 bg-white rounded-lg p-4 my-2">
          <input #fileInput type="file" (change)="onFileSelected($event)" class="hidden">
          <button type="button" class="w-1/3 px-12 py-2 text-white rounded-lg bg-mainGreen hover:bg-hoverGreen"
            (click)="triggerFileInput()">Select Image</button>
        </div>
      </div>

      <!-- Container Type Selection -->
      <div>
        <label class="block text-sm font-medium text-gray-700">Select Container Type</label>
        <select [(ngModel)]="newContainer.type" name="containerType" [ngModelOptions]="{standalone: true}"
          class="w-full border border-gray-300 text-gray-900 text-sm rounded-lg p-2.5">
          @for (type of availableTypes; track type) {
            <option [value]="type">{{ type }}</option>
          }
        </select>
      </div>

      <!-- Create Container Button -->
      <button type="submit" class="w-full px-12 py-2 text-white rounded-lg bg-mainGreen hover:bg-hoverGreen">
        Create Container
      </button>

      <!-- Cancel Button -->
      <button (click)="goBack()"
        class="block text-center w-full rounded-md bg-gray-200 px-3 py-2 text-sm font-semibold text-gray-900 hover:bg-gray-300">
        Cancel
      </button>
    </form>
  </div>
</section>
